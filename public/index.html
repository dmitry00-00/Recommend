<!doctype html>
<html lang="ru" data-theme="dark">
  <!-- Тема: data-theme="dark" — «Лента», data-theme="light" — «Просмотровая». -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Transformative Media</title>
    <!-- Telegram Mini App: скрипт обязан стоять в <head> до приложения. Вне Telegram
         (и в dist/standalone.html без сети) он не загрузится — оболочка это переживает. -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script type="module" crossorigin src="./assets/index-DOR-u4yD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DpZ_xeyW.css">
  </head>
  <body>
    <div id="root">
      <!-- Видно только если файл открыт напрямую: React затирает это при монтировании. -->
      <div style="font-family: system-ui, sans-serif; max-width: 34em; margin: 12vh auto; padding: 0 1.5em; color: #f3f0e9; line-height: 1.55">
        <h1 style="font-size: 1.4em">Это исходники, а не страница</h1>
        <p>Файл — точка входа Vite: браузер не умеет исполнять TSX сам. Запустите:</p>
        <pre style="background: #1e1f22; padding: 1em; overflow: auto">npm install
npm run dev</pre>
        <p>и откройте <code>http://localhost:5173</code>.</p>
        <p>Если нужно просто посмотреть, без установки — откройте <code>dist/standalone.html</code>:
        там всё внутри одного файла и работает двойным щелчком.</p>
      </div>
    </div>
  </body>
</html>
